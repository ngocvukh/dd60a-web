<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấu Hình In DD60A</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 460px; margin: 16px auto; padding: 0 12px; background: #f4f6f8; color: #222; }
    .card { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 14px; }
    h2 { margin-top: 0; font-size: 20px; text-align: center; color: #1a73e8; }
    h3 { margin: 0 0 10px; font-size: 16px; color: #333; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 12px; margin-left: 6px; font-weight: normal; }
    .badge-preset { background: #e8f0fe; color: #1a73e8; }
    .badge-manual { background: #fef7e0; color: #b06000; }
    .btn { width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #1a73e8; color: #fff; }
    .btn-test { background: #34a853; color: #fff; margin-top: 10px; }
    .btn-secondary { background: #eef2f6; color: #333; margin-top: 10px; }
    .btn-small { padding: 6px 10px; font-size: 13px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-danger { background: #fce8e6; color: #c5221f; }
    .btn-add { background: #e6f4ea; color: #137333; margin-top: 8px; width: 100%; padding: 10px; }
    #status, #presetStatus { text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; }
    .preset-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
    .preset-item:last-child { border-bottom: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>CẤU HÌNH PHIẾU IN DD60A</h2>

    <label>Tên mẫu (SAMPLE):</label>
    <input type="text" id="sample" placeholder="VD: Mẫu A1">

    <label>Người đo (NAME):</label>
    <input type="text" id="name" placeholder="VD: Tuấn">

    <div class="row">
      <div>
        <label>Loại:</label>
        <select id="typeSelect" onchange="onTypeChange()">
          <option value="Dieu">Điếu</option>
          <option value="Dau loc">Đầu lọc</option>
        </select>
      </div>
      <div>
        <label>Phân loại:</label>
        <select id="subTypeSelect" onchange="onSubTypeChange()"></select>
      </div>
    </div>

    <label>
      Chu vi đo (mm):
      <span id="circBadge" class="badge badge-preset">Theo phân loại</span>
    </label>
    <input type="number" id="circ" step="0.01" min="1" placeholder="VD: 24.50" oninput="onCircInput()">

    <label>Số chữ số thập phân cho mm &amp; % (0 - 4):</label>
    <input type="number" id="dec" min="0" max="4" value="2">

    <button class="btn btn-save" onclick="saveConfig(false)">LƯU CẤU HÌNH</button>
    <button class="btn btn-test" onclick="saveConfig(true)">LƯU &amp; IN THỬ</button>
    <button class="btn btn-secondary" onclick="togglePresetManager()">QUẢN LÝ PHÂN LOẠI &amp; CHU VI</button>
    <div id="status"></div>
  </div>

  <div id="presetManager" class="card hidden">
    <h3>Danh sách Phân loại &amp; Chu vi</h3>
    <div id="presetList"></div>

    <h3 style="margin-top: 14px;">Thêm / Cập nhật phân loại</h3>
    <div class="row">
      <div>
        <label>Loại:</label>
        <select id="newPresetType">
          <option value="Dieu">Điếu</option>
          <option value="Dau loc">Đầu lọc</option>
        </select>
      </div>
      <div>
        <label>Chu vi (mm):</label>
        <input type="number" id="newPresetCirc" step="0.01" min="1" placeholder="24.50">
      </div>
    </div>
    <label>Tên phân loại:</label>
    <input type="text" id="newPresetName" placeholder="VD: King Size">
    <button class="btn-small btn-add" onclick="addOrUpdatePreset()">+ THÊM / CẬP NHẬT PHÂN LOẠI</button>
    <div id="presetStatus"></div>
  </div>

  <script>
    // THAY LINK FIREBASE CUA BAN VAO DAY (khong co /dd60a.json o cuoi)
    const FIREBASE_BASE = "https://dd60a-244ce-default-rtdb.asia-southeast1.firebasedatabase.app";
    const CONFIG_URL  = FIREBASE_BASE + "/dd60a.json";
    const PRESETS_URL = FIREBASE_BASE + "/dd60a_presets.json";

    const DEFAULT_PRESETS = [
      { type: "Dieu",    name: "King Size",    circ: 24.50 },
      { type: "Dieu",    name: "Demi Slim",    circ: 21.00 },
      { type: "Dieu",    name: "Super Slim",   circ: 17.00 },
      { type: "Dau loc", name: "Dau loc Mono", circ: 24.50 },
      { type: "Dau loc", name: "Dau loc Than", circ: 24.50 }
    ];

    let presets = [...DEFAULT_PRESETS];

    function removeAccents(str) {
      return (str || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .trim();
    }

    function renderSubTypes(selectedSubType = null) {
      const currentType = document.getElementById("typeSelect").value;
      const select = document.getElementById("subTypeSelect");
      select.innerHTML = "";

      const nullOpt = document.createElement("option");
      nullOpt.value = "__NULL__";
      nullOpt.textContent = "-- Để trống (Không tính %) --";
      select.appendChild(nullOpt);

      const filtered = presets.filter(p => p.type === currentType);
      filtered.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.name;
        opt.textContent = `${p.name} (${Number(p.circ).toFixed(2)} mm)`;
        select.appendChild(opt);
      });

      const manualOpt = document.createElement("option");
      manualOpt.value = "__MANUAL__";
      manualOpt.textContent = "-- Nhập tay chu vi --";
      select.appendChild(manualOpt);

      if (!selectedSubType || selectedSubType === "__NULL__") {
        select.value = "__NULL__";
      } else if (filtered.some(p => p.name === selectedSubType)) {
        select.value = selectedSubType;
      } else if (selectedSubType === "__MANUAL__") {
        select.value = "__MANUAL__";
      } else {
        select.value = "__NULL__";
      }
    }

    function onTypeChange() {
      renderSubTypes();
      onSubTypeChange();
    }

    function onSubTypeChange() {
      const currentType = document.getElementById("typeSelect").value;
      const subName = document.getElementById("subTypeSelect").value;
      if (subName === "__NULL__") {
        document.getElementById("circ").value = "";
      } else {
        const found = presets.find(p => p.type === currentType && p.name === subName);
        if (found) {
          document.getElementById("circ").value = Number(found.circ).toFixed(2);
        }
      }
      updateManualBadge();
    }

    function isManualCirc() {
      const currentType = document.getElementById("typeSelect").value;
      const subName = document.getElementById("subTypeSelect").value;
      const circVal = parseFloat(document.getElementById("circ").value);
      const found = presets.find(p => p.type === currentType && p.name === subName);
      if (!found || isNaN(circVal)) return true;
      return Math.abs(circVal - Number(found.circ)) > 0.001;
    }

    function updateManualBadge() {
      const badge = document.getElementById("circBadge");
      const circRaw = document.getElementById("circ").value.trim();
      const circVal = parseFloat(circRaw);
      if (circRaw === "" || isNaN(circVal) || circVal <= 0) {
        badge.textContent = "Chưa có chu vi (Chỉ in mm)";
        badge.className = "badge badge-manual";
      } else if (isManualCirc()) {
        badge.textContent = "Chu vi nhập tay";
        badge.className = "badge badge-manual";
      } else {
        badge.textContent = "Theo phân loại";
        badge.className = "badge badge-preset";
      }
    }

    function onCircInput() {
      updateManualBadge();
    }

    function togglePresetManager() {
      document.getElementById("presetManager").classList.toggle("hidden");
      renderPresetList();
    }

    function renderPresetList() {
      const list = document.getElementById("presetList");
      list.innerHTML = "";
      presets.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "preset-item";
        div.innerHTML = `
          <span><strong>[${p.type}]</strong> ${p.name} - <b>${Number(p.circ).toFixed(2)} mm</b></span>
          <button class="btn-small btn-danger" onclick="deletePreset(${idx})">Xóa</button>
        `;
        list.appendChild(div);
      });
    }

    async function syncPresetsToFirebase() {
      const ps = document.getElementById("presetStatus");
      ps.style.color = "#555";
      ps.innerText = "Đang lưu danh sách...";
      try {
        await fetch(PRESETS_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(presets)
        });
        ps.style.color = "green";
        ps.innerText = "Đã cập nhật danh sách phân loại!";
        renderPresetList();
        renderSubTypes(document.getElementById("subTypeSelect").value);
      } catch (e) {
        ps.style.color = "red";
        ps.innerText = "Lỗi lưu danh sách!";
      }
    }

    async function addOrUpdatePreset() {
      const type = removeAccents(document.getElementById("newPresetType").value);
      const name = removeAccents(document.getElementById("newPresetName").value);
      const circ = parseFloat(document.getElementById("newPresetCirc").value);
      if (!name || isNaN(circ) || circ <= 0) {
        alert("Vui lòng nhập tên phân loại và chu vi hợp lệ!");
        return;
      }
      const existingIdx = presets.findIndex(p => p.type === type && p.name.toLowerCase() === name.toLowerCase());
      if (existingIdx >= 0) {
        presets[existingIdx].circ = circ;
      } else {
        presets.push({ type, name, circ });
      }
      document.getElementById("newPresetName").value = "";
      document.getElementById("newPresetCirc").value = "";
      await syncPresetsToFirebase();
    }

    async function deletePreset(idx) {
      presets.splice(idx, 1);
      await syncPresetsToFirebase();
    }

    window.onload = async () => {
      try {
        const pRes = await fetch(PRESETS_URL);
        const pData = await pRes.json();
        if (Array.isArray(pData) && pData.length > 0) {
          presets = pData.map(p => ({
            type: removeAccents(p.type),
            name: removeAccents(p.name),
            circ: Number(p.circ)
          }));
        }
      } catch (e) { console.error(e); }

      try {
        const res = await fetch(CONFIG_URL);
        const data = await res.json();
        if (data) {
          document.getElementById("sample").value = data.sample || "";
          document.getElementById("name").value   = data.name || "";
          if (data.type) document.getElementById("typeSelect").value = removeAccents(data.type);
          const hasValidCirc = (data.circ && Number(data.circ) > 0);
          renderSubTypes(hasValidCirc ? (data.isManualCirc ? "__MANUAL__" : removeAccents(data.subType)) : "__NULL__");
          document.getElementById("circ").value = hasValidCirc ? Number(data.circ).toFixed(2) : "";
          document.getElementById("dec").value = data.dec ?? 2;
          updateManualBadge();
          return;
        }
      } catch (e) { console.error(e); }

      renderSubTypes("__NULL__");
      onSubTypeChange();
    };

    async function saveConfig(isTest) {
      const status = document.getElementById("status");
      const circRaw = document.getElementById("circ").value.trim();
      const circVal = circRaw === "" ? null : parseFloat(circRaw);
      if (circVal !== null && (isNaN(circVal) || circVal <= 0)) {
        status.style.color = "red";
        status.innerText = "Chu vi phải lớn hơn 0 (hoặc để trống)!";
        return;
      }

      status.style.color = "#555";
      status.innerText = "Đang gửi dữ liệu...";

      const hasCirc = (circVal !== null);
      const manual = hasCirc ? isManualCirc() : false;
      const subTypeRaw = document.getElementById("subTypeSelect").value;
      const parsedDec = parseInt(document.getElementById("dec").value, 10);
      const decVal = Math.min(4, Math.max(0, isNaN(parsedDec) ? 2 : parsedDec));

      const sampleVal = removeAccents(document.getElementById("sample").value);
      const nameVal   = removeAccents(document.getElementById("name").value);

      const payload = {
        sample:       sampleVal || null,
        name:         nameVal || null,
        type:         hasCirc ? removeAccents(document.getElementById("typeSelect").value) : null,
        subType:      hasCirc ? (manual ? "Nhap tay" : removeAccents(subTypeRaw)) : null,
        circ:         hasCirc ? Number(circVal.toFixed(2)) : null,
        isManualCirc: hasCirc ? manual : null,
        dec:          decVal,
        testPrint:    isTest
      };

      try {
        await fetch(CONFIG_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        status.style.color = "green";
        status.innerText = isTest ? "Đã gửi lệnh in thử!" : "Đã lưu cấu hình thành công!";
      } catch (e) {
        status.style.color = "red";
        status.innerText = "Lỗi kết nối mạng!";
      }
    }
  </script>
</body>
</html>
