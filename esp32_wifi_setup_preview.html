<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cài Đặt ESP32 DD60A</title>
<style>
  body{font-family:Arial,sans-serif;max-width:430px;margin:16px auto;padding:0 12px;background:#f4f6f8;color:#222;}
  .card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:14px;}
  h2{margin-top:0;font-size:18px;color:#1a73e8;text-align:center;}
  label{display:block;margin-top:12px;font-weight:bold;font-size:14px;}
  input,select{width:100%;padding:10px;margin-top:4px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:15px;}
  button{width:100%;padding:12px;margin-top:14px;border:none;border-radius:6px;background:#1a73e8;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;}
  .btn-green{background:#34a853;}
  .info{background:#f8f9fa;padding:10px;border-radius:6px;font-size:13px;line-height:1.6;}
</style></head><body>

<div class="card">
  <h2>TRẠNG THÁI HỆ THỐNG DD60A</h2>
  <div class="info">
    <div><b>Wi-Fi đang lưu:</b> WIFI_XUONG_2.4G</div>
    <div><b>Trạng thái mạng:</b> <span style='color:#137333;font-weight:bold;'>Đã kết nối (192.168.1.45)</span></div>
    <div><b>Cổng máy in Citizen:</b> 2400 bps, 7-N-1, X-ON/X-OFF</div>
  </div>
</div>

<div class="card">
  <h2>CẤU HÌNH MÁY IN CITIZEN</h2>
  <form method="POST" action="/save-printer" onsubmit="event.preventDefault();alert('Demo: Da luu cong may in (tren ESP32 that se goi POST /save-printer)')">
    <label>Tốc độ truyền (Baud rate):</label>
    <select name="baud">
      <option value="1200">1200 bps</option>
      <option value="2400" selected>2400 bps (Mặc định máy in hiện tại)</option>
      <option value="4800">4800 bps</option>
      <option value="9600">9600 bps (Chuẩn xuất xưởng Citizen)</option>
      <option value="19200">19200 bps</option>
      <option value="38400">38400 bps</option>
      <option value="57600">57600 bps</option>
      <option value="115200">115200 bps</option>
    </select>
    <label>Số bit dữ liệu (Data bits):</label>
    <select name="bits">
      <option value="7" selected>7 bits</option>
      <option value="8">8 bits</option>
    </select>
    <label>Kiểm tra chẵn lẻ (Parity):</label>
    <select name="parity">
      <option value="N" selected>None - Không (Mặc định)</option>
      <option value="E">Even - Chẵn</option>
      <option value="O">Odd - Lẻ</option>
    </select>
    <label>Bắt tay (Handshaking):</label>
    <select name="hs">
      <option value="X" selected>X-ON/X-OFF (Mặc định Citizen)</option>
      <option value="N">None - Không dùng</option>
    </select>
    <button type="submit" class="btn-green">LƯU CẤU HÌNH MÁY IN</button>
  </form>
</div>

<div class="card">
  <h2>CẤU HÌNH WI-FI ESP32</h2>
  <form method="POST" action="/save" onsubmit="event.preventDefault();alert('Demo: Da luu Wi-Fi vao NVS va khoi dong lai ESP32')">
    <label>Chọn mạng Wi-Fi (2.4GHz):</label>
    <a href="?scan=1" onclick="event.preventDefault();document.getElementById('scan').innerHTML='<option value=\'\'>-- Chọn từ danh sách quét --</option><option value=\'WIFI_XUONG_2.4G\'>WIFI_XUONG_2.4G (-48 dBm)</option><option value=\'QC_LAB_2.4G\'>QC_LAB_2.4G (-63 dBm)</option>';" style="display:inline-block;margin-top:8px;font-size:13px;color:#1a73e8;text-decoration:none;font-weight:bold;">🔄 Quét mạng Wi-Fi xung quanh</a>
    <select id="scan" onchange="document.getElementById('ssid').value=this.value">
      <option value="">-- Chọn từ danh sách quét --</option>
    </select>
    <label>Hoặc nhập tên Wi-Fi (SSID):</label>
    <input type="text" id="ssid" name="ssid" value="WIFI_XUONG_2.4G" required>
    <label>Mật khẩu Wi-Fi:</label>
    <input type="password" name="pass" placeholder="Để trống nếu Wi-Fi không mật khẩu">
    <button type="submit">LƯU WI-FI &amp; KẾT NỐI LẠI</button>
  </form>
</div>

</body></html>
